<style id="cinematic-camera">
.room{perspective:1500px;transform-style:preserve-3d;box-shadow:0 18px 46px #0006,inset 0 1px #ffffff18;cursor:grab;touch-action:pan-y;user-select:none}
.room.is-camera-dragging{cursor:grabbing}
.scene-layer{transform-style:preserve-3d;backface-visibility:hidden;transition:transform 1.55s cubic-bezier(.22,.68,.18,1);will-change:transform}
.room-photo{transform:scale(1.035);filter:contrast(1.035) saturate(.94) brightness(.97);transition:opacity .7s ease,filter 1.2s ease,transform 1.1s cubic-bezier(.2,.65,.3,1)}
.room.depth-ready #roomPhoto{opacity:0!important}
#depthParallax{position:absolute;inset:0;z-index:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .35s ease}
.room.depth-ready #depthParallax{opacity:1}
#depthParallax.camera-fade{opacity:.2}
.room.is-camera-dragging .scene-layer,.room.is-camera-dragging .room-photo{transition:none!important}
#room3dCanvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;touch-action:none}
.room.has-three-room #roomPhoto,.room.has-three-room #depthParallax{display:none!important}
.room.has-three-room .scene-layer{z-index:3;transform:none!important;perspective:none!important}
.room.has-three-room #crt{z-index:5;overflow:hidden;border:0;border-radius:2px;background:#09100e;box-shadow:inset 0 0 15px #000b;}
.room.has-three-room #crt video{width:100%;height:100%;object-fit:cover}
.room.has-three-room #wall{z-index:4;overflow:hidden;border:0;background:transparent;box-shadow:none;pointer-events:none}
.room.has-three-room #wall .wall-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.room.has-three-room #shredderObject{z-index:4;object-fit:contain;opacity:0;}
.room.has-three-room .weather-glass{z-index:2;pointer-events:none}
.room-photo.camera-fade{opacity:.18;filter:contrast(1.04) saturate(.82) brightness(.88)}
#room::after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 48%,#17100b18 100%),linear-gradient(180deg,#12100c08 48%,#17100c38 100%);box-shadow:inset 0 0 68px #100c0833}
.room-overview,.scene-toggle{z-index:8}
.room .hot,.room #wall,.room #crt,.room .incense-btn,.room .shredder-object{filter:drop-shadow(0 3px 8px #130d08aa)}
.room .hot{transition:opacity .45s ease,background .3s ease,border-color .3s ease}
@media(prefers-reduced-motion:reduce){.scene-layer,.room-photo{transition:none!important}.room-photo.camera-fade{opacity:1}}

rted"))}}$("roomOverview").onclick=()=>focusScene("wide");$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);$("today").onclick=()=>{if(!dirty||confirm(tr("switchDate")))loadDay(today())};

  setAudio: async (f, t) => { draft.audio = f; if (t != null) draft.song = t; mark(); saveDay(); return true; },
  setVideo: async f => { draft.video = f; mark(); return await saveDay(); },
  hasPlayer: () => !!(roomRecordPlayer && roomRecordPlayer.src),
  play: async () => { const a = draft && draft.audio; if (!a) return false; try { if (roomRecordPlayer) { roomRecordPlayer.pause(); roomRecordPlayer.src = ""; } if (roomRecordUrl) URL.revokeObjectURL(roomRecordUrl); let blob = a; try { blob = new Blob([await a.arrayBuffer()], { type: a.type || "audio/mpeg" }); } catch (e) {} roomRecordUrl = URL.createObjectURL(blob); roomRecordPlayer = new Audio(roomRecordUrl); roomRecordPlayer.loop = true; roomRecordPlayer.volume = .62; $("crtMsg").textContent = draft.song || a.name || ""; await roomRecordPlayer.play(); dayMusicOn = true; musicLabel(); return true; } catch (e) { return false; } },
  pause: () => { if (roomRecordPlayer) roomRecordPlayer.pause(); musicLabel(); },

window.roomPhotoBridge = { lang: () => lang, day: () => day,
  photos: () => { if (!draft) return []; if (Array.isArray(draft.photos) && draft.photos.length) return draft.photos.slice(); return draft.photo ? [draft.photo] : []; },
  add: async files => { const shrink = f => new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .86)); }; im.onerror = () => res(null); im.src = r.result; }; r.onerror = () => res(null); r.readAsDataURL(f); });
    const list = window.roomPhotoBridge.photos(); for (const f of files) { const u = await shrink(f); if (u) list.push(u); } list.splice(0, Math.max(0, list.length - 36)); draft.photos = list; draft.photo = list[0] || ""; mark(); saveDay(); return list; },
  remove: async i => { const list = window.roomPhotoBridge.photos(); list.splice(i, 1); draft.photos = list; draft.photo = list[0] || ""; mark(); await saveDay(); return list; } };
